# 桌面 app 的双平台构建。
#
# 为什么必须用 CI：sidecar 能靠 Bun 交叉编译（在 Linux 上就能出 Windows 的 .exe），
# 但 **Tauri 的 Rust 壳不能**——Windows 安装包得在 Windows 上编。所以每个平台
# 一台 runner，各自原生编译自己的 sidecar 与安装包。
#
# 注意：仓库的 origin 是局域网 Gitea，这个文件在那边不会自动生效。要跑起来，
# 要么给仓库加一个 GitHub remote 推上去，要么给 Gitea 注册一个 Windows
# Actions runner（语法兼容，但 runner 要自己准备）。
name: app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 而不是 latest：AppImage / deb 链接的 glibc 版本越低，
          # 能装的发行版越多。
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 闸门：壳不该掩盖核心的问题。测试挂了就不要出包。
      - name: 跑测试
        run: npm test

      - name: Linux 构建依赖
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev patchelf libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      # 编译 Rust 壳很慢，缓存能把重复构建从几分钟压到几十秒。
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/shells/desktop

      # sidecar 由 tauri.conf.json 的 beforeBuildCommand 自动构建，
      # 不必在这里单独跑一步。

      # projectPath 指向桌面壳所在目录（Tauri 工程根就是它自己，里面直接放着
      # tauri.conf.json）。不给这个参数的话 action 会从仓库根去找 src-tauri/。
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: src/shells/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: novelforge-${{ matrix.name }}
          # 只收安装包，不收 90 MB 的 sidecar 中间产物。tauri.conf.json 里
          # targets 是 "all"，各平台产出什么由 Tauri 按平台决定，所以这里用通配
          # 而不是写死目录名。
          path: |
            src/shells/desktop/target/release/bundle/*/*.AppImage
            src/shells/desktop/target/release/bundle/*/*.deb
            src/shells/desktop/target/release/bundle/*/*.rpm
            src/shells/desktop/target/release/bundle/*/*.exe
            src/shells/desktop/target/release/bundle/*/*.msi
          if-no-files-found: error
