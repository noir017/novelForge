# Android app 的构建。两种用法：
# - 手动点（workflow_dispatch）：出 debug 签名的包，只进 artifact，日常验证「还能编出来」、拿去手机上试。
# - 发版时由 release.yml 调用（release: true）：用仓库 secrets 里的发版密钥签名，产物交给 release 汇总。
#
# 为什么在 CI 上编：Google 的 aapt2 只出 x86_64，开发机是 arm64；ubuntu runner 自带 Android SDK。
# 打包本身见 src/shells/android/scripts/build.sh：独立版打成 node 单文件进 assets，Termux 的 node 进 jniLibs。
name: android

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      NOVELFORGE_KEYSTORE_BASE64:
        required: false
      NOVELFORGE_KEYSTORE_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      # 闸门：壳不该掩盖核心的问题。测试挂了就不要出包。
      - name: 跑测试
        run: npm test

      - name: 打 debug 包
        if: ${{ !inputs.release }}
        run: |
          src/shells/android/scripts/build.sh debug
          cp src/shells/android/app/build/outputs/apk/debug/app-debug.apk novelforge-android-debug.apk

      # 发版必须用发版密钥：签名不同的包不能覆盖安装，退回 debug 签名的话装过的人升不了级。缺了就停下。
      - name: 打发版包
        if: ${{ inputs.release }}
        env:
          KEYSTORE_BASE64: ${{ secrets.NOVELFORGE_KEYSTORE_BASE64 }}
          NOVELFORGE_KEYSTORE_PASSWORD: ${{ secrets.NOVELFORGE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$NOVELFORGE_KEYSTORE_PASSWORD" ]; then
            echo "::error::仓库 secrets 里缺 NOVELFORGE_KEYSTORE_BASE64 / NOVELFORGE_KEYSTORE_PASSWORD（Android 发版密钥）"
            exit 1
          fi
          export NOVELFORGE_KEYSTORE="$RUNNER_TEMP/release.jks"
          base64 -d <<<"$KEYSTORE_BASE64" > "$NOVELFORGE_KEYSTORE"
          keytool -list -keystore "$NOVELFORGE_KEYSTORE" -storepass "$NOVELFORGE_KEYSTORE_PASSWORD" -alias novelforge | grep -i fingerprint
          src/shells/android/scripts/build.sh release
          rm -f "$NOVELFORGE_KEYSTORE"
          cp src/shells/android/app/build/outputs/apk/release/app-release.apk novelforge-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: novelforge-android*.apk
          if-no-files-found: error
