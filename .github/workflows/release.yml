# 正式发布：推一个 v* tag 触发，一次出齐四条发布路径的产物。
#
# 与 app.yml 的分工：app.yml 是手动点的桌面壳构建（日常验证「还能编出来」），
# 这个文件是**发版**时才跑的一条完整流水线——桌面安装包 + VS Code 扩展
# .vsix + 独立版单文件可执行，汇总成一个 GitHub Release 草稿；另外调 docker.yml
# 往 GHCR 推独立版的 Docker 镜像。
#
# 版本号只记在仓库根 package.json 一处（tauri.conf.json 指过去，独立版编译时写进程序）。
# 发版在本地做：`npm version patch|minor|major` 先跑全量测试，再改版本号、提交、打 tag，
# `git push --follow-tags` 推上来就到这里。所以这条流水线**不改版本号、不往 main 写**，
# 只核对 tag 与 package.json 对得上。
#
# 只认 tag 触发：这条流水线要编两次 Rust 壳、跑两遍全量测试，是仓库里最贵的一个 job，
# 不该由推 main 引发；而 tag 本身就是「决定发版」这件事。
name: release

on:
  push:
    tags: ['v*']

# 同一个 tag 重复触发时，掐掉旧的那次——两次发布跑在一起只会互相踩。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 创建 Release 要写权限

jobs:
  # ── 1) 版本号核对 ───────────────────────────────────────────────
  # tag 是谁打的不由这里管（本地 npm version 打），但 tag 与 package.json 对不上的话，
  # Release 的名字与安装包里的版本号就是两个数，所以先核对，对不上就整条停下。
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: 核对版本号
        id: pick
        run: |
          tag="${{ github.ref_name }}"
          v="${tag#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$v" != "$pkg" ]; then
            echo "::error::tag $tag 与 package.json 的版本号 $pkg 对不上（应当用 npm version 打 tag）"
            exit 1
          fi
          # Windows MSI 只认纯数字的版本号，0.2.0-beta.0 这种在桌面构建那一步才会炸，这里先拦下。
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号 $v 不是 X.Y.Z（只支持 npm version patch / minor / major）"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "本次发布版本：$v"

  # ── 2) VS Code 扩展 + 独立版可执行 ──────────────────────────────
  # 这两样合成一个 job：都只依赖 Node/Bun，不需要 Rust，也不需要原生 Windows
  # ——Bun 能交叉编译出 .exe。合在一起省一次 npm ci 和一遍测试。
  bundles:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      # 闸门：测试挂了就不该有产物流出去。
      - name: 跑测试
        run: npm test

      # 独立版：两个平台都由 Bun 交叉编译，产物带平台后缀便于区分。
      - name: 构建独立版（linux + windows）
        run: |
          node scripts/embed-media.js
          bun build src/shells/standalone/main.ts --compile \
            --target=bun-linux-x64 --outfile dist/novelforge-linux-x64
          bun build src/shells/standalone/main.ts --compile \
            --target=bun-windows-x64 --outfile dist/novelforge-windows-x64.exe

      # .vsix 必须在独立版**之后**打，且靠 .vscodeignore 把 dist/novelforge*
      # 排除掉——否则 113 MB 的可执行会被塞进扩展包。
      - name: 打包 .vsix
        run: npx --yes @vscode/vsce@latest package --no-dependencies --out novel-forge-${{ needs.version.outputs.version }}.vsix

      # 防呆闸门：.claude/ 与 local/ 是本机私有目录，绝不能进公开产物。
      # vsce 一旦看到 .vscodeignore 就完全无视 .gitignore，所以这里实测一遍
      # 包内清单，而不是信任配置。
      - name: 校验 .vsix 未夹带私有文件
        run: |
          list="$(unzip -Z1 novel-forge-${{ needs.version.outputs.version }}.vsix)"
          echo "$list"
          if echo "$list" | grep -Ei '(^|/)(\.claude|\.cursor|\.worktrees|local|temp)/'; then
            echo "::error::.vsix 里夹带了私有目录，检查 .vscodeignore"
            exit 1
          fi
          if echo "$list" | grep -E 'dist/novelforge'; then
            echo "::error::.vsix 里夹带了独立版可执行（应由 .vscodeignore 排除）"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            *.vsix
            dist/novelforge-linux-x64
            dist/novelforge-windows-x64.exe
          if-no-files-found: error

  # ── 3) 桌面安装包 ───────────────────────────────────────────────
  # Rust 壳不能交叉编译，所以每个平台一台原生 runner。
  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 而不是 latest：链接的 glibc 越低，能装的发行版越多。
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 跑测试
        run: npm test

      - name: Linux 构建依赖
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev patchelf libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      # 编 Rust 壳很慢，缓存能把重复构建从几分钟压到几十秒。
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/shells/desktop

      # sidecar 由 tauri.conf.json 的 beforeBuildCommand 自动构建，不必单独跑。
      #
      # Linux 只出 deb + rpm，**不出 AppImage**：AppImage 由 linuxdeploy 打，
      # 而 linuxdeploy 会对包进去的每个可执行跑 patchelf 改 ELF 头。我们的
      # sidecar 是 Bun `--compile` 出来的单文件可执行——ELF 后面直接粘着 JS
      # 运行时与脚本，patchelf 一改就把这段 payload 的偏移弄坏。装了 libfuse2、
      # 加了 APPIMAGE_EXTRACT_AND_RUN 与 NO_STRIP 都只解决「linuxdeploy 跑不
      # 起来」，解决不了「它不该碰这个二进制」。deb / rpm 走 Tauri 自己的打包
      # 器，原样复制 sidecar，所以一直是好的。
      #
      # 要恢复 AppImage 就得让 sidecar 不经 linuxdeploy 之手（例如改由 app
      # 运行时下载，或换成非单文件的分发形式），那是另一件事。
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: src/shells/desktop
          args: ${{ matrix.name == 'linux' && '--bundles deb,rpm' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # sidecar 是 Bun 编出来的单文件可执行，strip 会把内嵌的 JS 运行时
          # 弄坏。deb/rpm 这条路本来不 strip，留着它是防打包器换实现。
          NO_STRIP: true

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          # 只收安装包，不收 90 MB 的 sidecar 中间产物。各平台产出什么由
          # Tauri 按平台决定，所以用通配而不写死目录名。
          path: |
            src/shells/desktop/target/release/bundle/*/*.deb
            src/shells/desktop/target/release/bundle/*/*.rpm
            src/shells/desktop/target/release/bundle/*/*.exe
            src/shells/desktop/target/release/bundle/*/*.msi
          if-no-files-found: error

  # ── 4) Docker 镜像 ──────────────────────────────────────────────
  # 整条流程在 docker.yml 里（手动点也走它，自带测试闸门与冒烟），这里只给版本号。
  # 和别的 job 并行，不拦 Release 草稿。注意镜像推上 GHCR 就公开了（:latest 也跟着动），
  # 不等作者在 GitHub 上把草稿点成公开。
  docker:
    needs: version
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.version.outputs.version }}
    # 被调用的 workflow 只能在这里给的权限内再收紧，所以推 GHCR 的写权限得从这里给。
    permissions:
      contents: read
      packages: write

  # ── 5) 汇总成 Release ───────────────────────────────────────────
  release:
    needs: [version, bundles, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 三个 job 的产物散在各自子目录里，摊平到一层好上传。
      - name: 摊平产物
        run: |
          mkdir -p out
          find artifacts -type f \
            \( -name '*.vsix' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.exe' -o -name '*.msi' \
               -o -name 'novelforge-linux-x64' \) \
            -exec cp {} out/ \;
          ls -lh out

      # 一律先出草稿：作者在 GitHub 上看过产物再点公开。
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Novel Forge ${{ needs.version.outputs.tag }}
          draft: true
          files: out/*
          fail_on_unmatched_files: true
